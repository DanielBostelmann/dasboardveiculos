<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2239">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Dashboard — Veículos à venda · Porto Velho</title>
<script>try{var t=localStorage.getItem('veic-tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>{{CSS}}</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-car" viewBox="0 0 24 24"><path d="M3 13l2-6h14l2 6v4h-2M5 17H3v-4M9.5 17h5M3 13h18"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17l9 5 9-5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 3 12V4a1 1 0 0 1 1-1h8a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.6z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M12 14a8 8 0 1 0-8-8"/><path d="M12 14l4-4"/></symbol>
</svg>
<header class="hero">
  <div class="hero-in">
    <div class="topbar">
      <div class="brand"><h1>Veículos à venda · Porto Velho</h1><p id="sub-loja">Estoque do pátio CS Seminovos</p></div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="btn-theme" data-act="tema" aria-label="Usar tema escuro"></button>
        <button type="button" class="icon-btn" data-act="imprimir" aria-label="Imprimir" title="Imprimir"><svg class="ic" aria-hidden="true"><use href="#i-print"/></svg></button>
      </div>
    </div>
    <button type="button" class="status" id="status" data-act="fontes" data-s="fixo" aria-haspopup="dialog">
      <span class="dot"></span><span id="status-txt">Dados fixos</span><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg>
    </button>
    <div class="hero-main">
      <div class="hero-total">
        <div><span class="big" id="h-total">0</span><span class="lbl">veículos disponíveis</span></div>
        <div class="hero-ratio" id="h-ratio"></div>
      </div>
      <div>
        <div class="hero-split" role="img" aria-label="Composição por modelo"><span class="l" id="h-l"></span><span class="p" id="h-p"></span><span class="c" id="h-c"></span></div>
        <div class="hero-legend" id="h-legend"></div>
      </div>
    </div>
    <p class="print-filters" id="print-filters"></p>
  </div>
</header>
<div class="notice" id="notice" role="status" aria-live="polite" hidden></div>
<nav class="tabs" role="tablist" aria-label="Seções da dashboard">
  <button type="button" class="tab" role="tab" data-act="tab" data-v="geral"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg><span>Geral</span></button>
  <button type="button" class="tab" role="tab" data-act="tab" data-v="modelos"><svg class="ic" aria-hidden="true"><use href="#i-layers"/></svg><span>Modelos</span></button>
  <button type="button" class="tab" role="tab" data-act="tab" data-v="veiculos"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg><span>Veículos</span></button>
  <button type="button" class="tab" role="tab" data-act="tab" data-v="comparar"><svg class="ic" aria-hidden="true"><use href="#i-scale"/></svg><span>Comparar</span></button>
</nav>
<div class="filterbar">
  <button type="button" class="filter-btn" data-act="filtros" aria-haspopup="dialog"><svg class="ic" aria-hidden="true"><use href="#i-filter"/></svg>Filtros <span class="badge" id="f-count"></span></button>
  <div class="chips-row" id="chips" aria-live="polite"></div>
</div>
<main id="main" tabindex="-1">
  <div class="kpis" id="kpis" aria-live="polite"></div>
  <div class="view" id="view" style="margin-top:12px"></div>
</main>
<footer id="footer"></footer>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head"><div><h2 id="sheet-title"></h2><p id="sheet-sub"></p></div>
    <button type="button" class="sheet-close" id="sheet-close" aria-label="Fechar"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot"></div>
</section>
<script type="application/json" id="cfg">{{CFG}}</script>
<script>{{JS}}</script>
</body>
</html>
