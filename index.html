:root{
  --bg:#eef3f6;--surface:#ffffff;--surface-2:#f3f7f9;--surface-3:#e8eff3;
  --ink:#102238;--muted:#5b6d80;--line:#dbe4ea;
  --navy:#0b2239;--navy-2:#153f61;--blue:#2078a8;
  --teal:#08a39a;--teal-ink:#067a73;--teal-soft:#dcf4f1;
  --orange:#f5a20b;--orange-ink:#9a6200;--orange-soft:#fff2cf;
  --navy-tone:#1f4f78;--danger:#c2410c;--ok:#0f9d58;
  --shadow:0 1px 2px rgba(11,34,57,.05),0 10px 28px rgba(11,34,57,.08);
  --shadow-lg:0 18px 50px rgba(11,34,57,.22);
  --r:18px;--nav-h:66px;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#06121e;--surface:#0e2132;--surface-2:#132a40;--surface-3:#1a3550;
  --ink:#e6eef5;--muted:#9fb3c6;--line:#22405b;
  --teal-ink:#46d3c9;--teal-soft:#0c3a3b;--orange-ink:#f8c25a;--orange-soft:#3a2c0c;
  --navy-tone:#6aa6d6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Dash Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);transition:background .3s,color .3s}
body.sheet-open{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:10px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- cabeçalho ---------- */
.hero{position:relative;overflow:hidden;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 58px;
  background:radial-gradient(circle at 92% -8%,rgba(8,163,154,.5) 0 110px,transparent 112px),
             radial-gradient(circle at 108% 60%,rgba(245,162,11,.2) 0 150px,transparent 152px),
             linear-gradient(150deg,var(--navy),var(--navy-2))}
.hero::after{content:"";position:absolute;inset:auto -20% -60% -20%;height:120%;background:radial-gradient(ellipse at center,rgba(255,255,255,.06),transparent 60%);pointer-events:none}
.hero-in{position:relative;max-width:1240px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px}
.brasao{width:46px;height:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand{min-width:0}
.brand h1{margin:0;font-size:18px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:13px;color:#c9d9e5}
.top-actions{margin-left:auto;display:flex;gap:8px;flex:none}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;transition:background .2s,transform .15s}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn:active{transform:scale(.94)}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 12px 7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.18);color:#fff;font-size:13px;font-weight:700}
.status .dot{width:9px;height:9px;border-radius:50%;background:#9fb3c6;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.status[data-s="online"] .dot{background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.2)}
.status[data-s="fixo"] .dot{background:var(--orange);box-shadow:0 0 0 4px rgba(245,162,11,.22)}
.status[data-s="parcial"] .dot{background:#fbbf24}
.status[data-s="carregando"] .dot{background:#7dd3fc;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(125,211,252,.0);opacity:.55}}
.status .ic{width:16px;height:16px;opacity:.8}
.hero-total{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:16px}
.hero-total .big{font-size:46px;line-height:1;font-weight:800;letter-spacing:-.03em}
.hero-total .lbl{display:block;margin-top:4px;font-size:13px;color:#c9d9e5;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.hero-ratio{text-align:right;font-size:13px;color:#c9d9e5}
.hero-ratio b{display:block;font-size:22px;color:#fff}
.hero-split{display:flex;height:12px;margin-top:14px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12)}
.hero-split span{display:block;height:100%;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hero-split .l{background:var(--teal)}.hero-split .p{background:var(--orange)}
.hero-legend{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;font-weight:700}
.hero-legend .l{color:#7ee6dd}.hero-legend .p{color:#ffd27a}

/* ---------- aviso de fonte dos dados ---------- */
.notice{position:relative;z-index:3;max-width:1240px;margin:-40px 12px 0;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);border-left:5px solid var(--muted);display:flex;gap:10px;align-items:flex-start;animation:rise .45s both}
.notice[data-s="online"]{border-left-color:var(--ok)}
.notice[data-s="fixo"]{border-left-color:var(--orange)}
.notice[data-s="parcial"]{border-left-color:#fbbf24}
.notice .ic{margin-top:1px;color:var(--muted)}
.notice p{margin:0;font-size:14px;line-height:1.45}
.notice .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.notice-close{margin-left:auto;flex:none;width:34px;height:34px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.notice[hidden]{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;font-weight:700;transition:background .2s,transform .15s,border-color .2s}
.btn:hover{border-color:var(--teal)}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{background:transparent}

/* ---------- barra de filtros ---------- */
.filterbar{position:sticky;top:0;z-index:20;max-width:1240px;margin:12px auto 0;padding:10px 12px;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px)}
.filter-btn{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:8px 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;box-shadow:var(--shadow)}
.filter-btn .ic{width:18px;height:18px;color:var(--teal-ink)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--orange);color:var(--navy);font-size:12px;font-weight:800;display:inline-grid;place-items:center}
.badge:empty{display:none}
.chips-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips-row::-webkit-scrollbar{display:none}
.chip-x{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 8px 6px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--teal) 45%,transparent);background:var(--teal-soft);color:var(--teal-ink);font-size:13px;font-weight:700;white-space:nowrap;animation:pop .25s both}
.chip-x .ic{width:16px;height:16px}
.chips-hint{font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- abas ---------- */
.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(11,34,57,.08)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;transition:color .2s}
.tab .ic{width:23px;height:23px;transition:transform .25s}
.tab[aria-selected="true"]{color:var(--teal-ink)}
.tab[aria-selected="true"]::before{content:"";position:absolute;inset:4px 10px;border-radius:12px;background:var(--teal-soft);z-index:-1;animation:pop .3s both}
.tab[aria-selected="true"] .ic{transform:translateY(-1px) scale(1.06)}

/* ---------- conteúdo ---------- */
main{max-width:1240px;margin:0 auto;padding:4px 12px 8px;outline:none}
.view{display:grid;gap:12px}
.view.anim{animation:fade .35s both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.grid>*,.card,.span-2{min-width:0}
.card{position:relative;padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);transition:transform .25s,box-shadow .25s}
.anim .card,.anim .unit{animation:rise .5s both;animation-delay:calc(var(--i,0) * 45ms)}
.kicker{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-ink)}
.kicker.own{color:var(--orange-ink)}
.card h2{margin:3px 0 12px;font-size:18px;line-height:1.2;letter-spacing:-.01em}
.card-note{margin:-6px 0 12px;font-size:13px;color:var(--muted)}
.card h3{margin:16px 0 8px;font-size:14px}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;margin-bottom:6px;color:var(--ink);font-size:16px}
.alert{padding:11px 13px;border-radius:13px;background:var(--orange-soft);border-left:4px solid var(--orange);font-size:13.5px;line-height:1.45}
.alert b{color:var(--ink)}
.alert.info{background:var(--teal-soft);border-left-color:var(--teal)}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{position:relative;overflow:hidden;padding:13px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);animation:rise .5s both;animation-delay:calc(var(--i,0) * 45ms)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--navy-tone)}
.kpi.t-l::before{background:var(--teal)}.kpi.t-p::before{background:var(--orange)}.kpi.t-w::before{background:var(--danger)}
.kpi-label{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi-val{display:block;margin-top:5px;font-size:28px;line-height:1;font-weight:800;letter-spacing:-.02em}
.kpi-sub{display:block;margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.3}

/* barras */
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;align-items:center;gap:10px;width:100%;min-height:38px;padding:4px 8px;margin:0 -8px;width:calc(100% + 16px);border:0;border-radius:11px;background:transparent;text-align:left;transition:background .2s}
button.bar:hover{background:var(--surface-2)}
.bar.is-active{background:var(--teal-soft)}
.bar-label{font-size:13.5px;font-weight:700;line-height:1.2}
.bar-track{display:block;height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar-fill{display:block;height:100%;width:0;min-width:3px;border-radius:999px;background:var(--navy-tone);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tone-teal .bar-fill{background:linear-gradient(90deg,#07857e,var(--teal))}
.tone-orange .bar-fill{background:linear-gradient(90deg,#e48e00,var(--orange))}
.bar-val{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;min-width:66px;white-space:nowrap}
.bar-val b{font-size:15px}
.bar-val small{font-size:12px;color:var(--muted)}
.link-btn{margin-top:6px;border:0;background:transparent;color:var(--teal-ink);font-weight:800;font-size:14px;padding:8px 0;min-height:40px}

/* barra empilhada */
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-3)}
.stack span{display:block;height:100%;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.seg-l{background:var(--teal)}.seg-p{background:var(--orange)}
.seg-a{background:var(--navy-2)}.seg-b{background:var(--blue)}.seg-c{background:#7fb3d5}.seg-d{background:#c4d3de}
[data-theme="dark"] .seg-a{background:#3f86c4}[data-theme="dark"] .seg-d{background:#4d6377}
.stack-row{margin-top:12px}
.stack-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px;font-weight:800}
.stack-head small{font-weight:700;color:var(--muted);font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink)}

/* rosca */
.donut-wrap{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.donut{position:relative;width:132px;height:132px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:16}
.donut .bg{stroke:var(--surface-3)}
.donut .seg{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-c b{font-size:26px;line-height:1}
.donut-c span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dl{display:grid;gap:8px}
.dl-row{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dl-row:last-child{border-bottom:0;padding-bottom:0}
.dl-row i{width:12px;height:12px;border-radius:4px}
.dl-row span{font-size:13.5px;font-weight:700}
.dl-row small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.dl-row b{font-size:19px}

/* grupos / destaques */
.groups{display:grid;gap:8px}
.group{display:block;width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);text-align:left;transition:border-color .2s,transform .15s,background .2s}
.group:hover{border-color:var(--teal)}
.group:active{transform:scale(.99)}
.group.is-active{border-color:var(--teal);background:var(--teal-soft)}
.group-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.group-top b{font-size:14.5px}
.group-top span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.group-top strong{font-size:17px}
.insights{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.insights li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--surface-2)}
.insights .n{min-width:58px;padding:6px 8px;border-radius:11px;background:var(--navy-2);color:#fff;text-align:center;font-weight:800;font-size:16px}
.insights .n.p{background:var(--orange);color:var(--navy)}.insights .n.l{background:var(--teal)}
.insights p{margin:0;font-size:13.5px;line-height:1.4}

/* tabelas e mini-chips */
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr));gap:8px}
.mini span{overflow-wrap:break-word}
.mini>*{display:block;width:100%;padding:10px;border-radius:13px;border:2px solid transparent;background:var(--surface-2);text-align:left}
.mini b{display:block;font-size:20px;line-height:1.1}
.mini span{display:block;margin-top:3px;font-size:12px;color:var(--muted);line-height:1.25}
.mini .dark{background:var(--navy-2);color:#fff}.mini .dark span{color:#cfe0ec}
.mini button{transition:border-color .2s,transform .15s}
.mini button:hover{border-color:color-mix(in srgb,var(--teal) 55%,transparent)}
.mini button[aria-pressed="true"]{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 20%,transparent)}
.tl{color:var(--teal-ink)}.tp{color:var(--orange-ink)}
.tbl td.warn{color:var(--danger);font-weight:800}
.leg-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink)}
.leg-btn b{font-weight:800}
.leg-btn.is-active{border-color:var(--teal);background:var(--teal-soft)}
.chip-x.limpar{background:transparent;border-color:var(--line);color:var(--muted);padding-right:12px}
.contract{padding:12px;border-radius:14px;background:var(--surface-2);margin-top:10px}
.contract-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px}
.contract-top b{font-size:14.5px}.contract-top span{font-size:13px;color:var(--muted);white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.tbl th{text-align:right;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800;padding:0 4px 6px;border-bottom:2px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl td:first-child{font-weight:700}
.tbl tr:last-child td{border-bottom:0}

/* histograma */
.hist{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:18px}
.hcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border:0;background:transparent;padding:0;border-radius:8px}
.hcol .hv{font-size:11.5px;font-weight:800}
.hcol .hb{width:100%;max-width:34px;height:0;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--orange),#e48e00);transition:height .8s cubic-bezier(.2,.8,.2,1)}
.hcol .hy{font-size:11px;color:var(--muted);font-weight:700}
.hcol.is-active .hb{background:linear-gradient(180deg,var(--teal),#07857e)}
.hcol:hover .hb{filter:brightness(1.08)}

/* comparação */
.cmp-row{display:block;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.cmp-row:last-child{border-bottom:0}
.cmp-row.is-active{background:var(--teal-soft);border-radius:12px;padding:10px;margin:0 -10px;width:calc(100% + 20px)}
.cmp-name{display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin-bottom:6px}
.cmp-name small{color:var(--muted);font-weight:700}
.cmp-bars{display:grid;gap:5px}
.cmp-line{display:grid;grid-template-columns:70px 1fr 44px;gap:8px;align-items:center;font-size:12.5px}
.cmp-line em{font-style:normal;font-weight:800}
.cmp-line.l em{color:var(--teal-ink)}.cmp-line.p em{color:var(--orange-ink)}
.cmp-line b{text-align:right;font-size:14px}
.cmp-line .bar-track{height:10px}
.cmp-line.p .bar-fill{background:var(--orange)}.cmp-line.l .bar-fill{background:var(--teal)}

/* unidades */
.toolbar{display:grid;grid-template-columns:1fr;gap:8px}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted)}
.search input{width:100%;min-height:46px;padding:10px 12px 10px 40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 18%,transparent)}
.seg-ctl{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-3);overflow-x:auto;scrollbar-width:none}
.seg-ctl button{flex:1 0 auto;min-height:38px;padding:6px 12px;border:0;border-radius:11px;background:transparent;font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(11,34,57,.15)}
.sel{width:100%;min-height:44px;padding:8px 12px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.units-list{display:grid;gap:6px}
.unit{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .2s,transform .15s,box-shadow .2s}
#u-area .unit{animation:rise .4s both;animation-delay:calc(var(--i,0) * 18ms)}
.unit:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.unit:active{transform:scale(.99)}
.unit-name{font-weight:800;font-size:15px;line-height:1.2}
.unit-name small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.unit-num{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.unit-num b{display:block;font-size:19px;color:var(--ink);line-height:1.05}
.unit .stack{grid-column:1/-1;height:10px}
.unit-lp{grid-column:1/-1;display:flex;gap:14px;font-size:12.5px;font-weight:700}
.unit-lp .l{color:var(--teal-ink)}.unit-lp .p{color:var(--orange-ink)}
.count-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 0;font-size:13px;color:var(--muted)}

/* ---------- painéis deslizantes ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,12,20,.45);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;border-radius:22px 22px 0 0;background:var(--surface);box-shadow:var(--shadow-lg);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:none}
.sheet[hidden]{display:none}
.sheet-grip{width:44px;height:5px;margin:9px auto 0;border-radius:999px;background:var(--line)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:18px;line-height:1.2}
.sheet-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.sheet-close{margin-left:auto;flex:none;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.sheet-body{overflow-y:auto;padding:14px 16px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.f-group{margin-bottom:18px}
.f-group > b{display:block;margin-bottom:8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f-chips{display:flex;flex-wrap:wrap;gap:6px}
.f-chip{min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;font-weight:700;transition:background .2s,border-color .2s,color .2s}
.f-chip small{margin-left:4px;color:var(--muted);font-weight:700}
.f-chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.f-chip[aria-pressed="true"] small{color:#e2fbf8}
.f-sep{margin:6px 0 14px;padding:10px 12px;border-radius:13px;background:var(--orange-soft);font-size:13px;line-height:1.4}
.src{padding:12px;border-radius:14px;background:var(--surface-2);margin-bottom:10px}
.src-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.src-top b{font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.on{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.off{background:var(--orange-soft);color:var(--orange-ink)}
.src dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:10px 0 0;font-size:13px}
.src dt{color:var(--muted)}
.src dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.src a{color:var(--teal-ink);font-weight:800}

footer{max-width:1240px;margin:8px auto 0;padding:12px 16px 4px;font-size:12.5px;line-height:1.5;color:var(--muted)}
footer b{color:var(--ink)}

/* ---------- telas maiores ---------- */
@media (min-width:560px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .toolbar{grid-template-columns:1fr auto}
}
@media (min-width:900px){
  body{padding-bottom:24px}
  .hero{padding:22px 28px 70px}
  .brasao{width:58px}
  .brand h1{font-size:26px}
  .brand p{font-size:15px}
  .hero-main{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:end;margin-top:18px}
  .hero-total{margin-top:0}
  .hero-total .big{font-size:60px}
  .notice{margin:-48px auto 0;max-width:1216px}
  .tabs{position:sticky;top:0;bottom:auto;left:auto;right:auto;max-width:1240px;margin:14px auto 0;padding:6px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);grid-template-columns:repeat(5,auto);justify-content:start;gap:4px}
  .tab{flex-direction:row;gap:8px;min-height:44px;padding:0 16px;font-size:14.5px}
  .tab[aria-selected="true"]::before{inset:2px}
  .filterbar{top:66px;margin-top:6px;padding:8px 12px}
  main{padding:4px 12px 8px}
  .view{gap:16px}
  .grid{gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .span-2{grid-column:1/-1}
  .kpis{grid-template-columns:repeat(6,1fr);gap:14px}
  .kpi-val{font-size:32px}
  .card{padding:20px}
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(11,34,57,.06),0 18px 40px rgba(11,34,57,.12)}
  .card h2{font-size:20px}
  .units-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:22px 0 0 22px;transform:translateX(105%)}
  .sheet-grip{display:none}
  .sheet-head{padding-top:18px}
}
@media (min-width:900px){
  .units-list{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .donut-wrap{grid-template-columns:180px 1fr;gap:24px}
  .donut{width:180px;height:180px}
  .donut-c b{font-size:34px}
}
.mini.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.f-chip[data-zero]{opacity:.5}
@media (max-width:899px){.desktop-only{display:none}}
@media (max-width:380px){
  .brand h1{font-size:16px}
  .kpi-val{font-size:24px}
  .donut-wrap{grid-template-columns:110px 1fr}
  .donut{width:110px;height:110px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tabs,.filterbar,.top-actions,.notice,.scrim,.sheet,.link-btn,.no-print{display:none!important}
  .hero{padding:14px 18px 18px;border-radius:14px}
  .status{display:none}
  main{padding:10px 0}
  .card,.kpi{box-shadow:none;border:1px solid #d5e0e7;break-inside:avoid;animation:none}
  .grid{grid-template-columns:1fr 1fr}
  .print-filters{display:block!important}
}
.print-filters{display:none;margin:8px 0 0;font-size:12px;color:#c9d9e5}

/* ---------- munições ---------- */
.seg-op{background:var(--navy-2)}.seg-tr{background:#7fb3d5}
[data-theme="dark"] .seg-op{background:#3f86c4}
.unit-lp .o,.to{color:var(--navy-tone)}.unit-lp .t,.tt{color:#4f8fbf}
[data-theme="dark"] .unit-lp .t,[data-theme="dark"] .tt{color:#9cc8e6}
.warn-t{color:var(--danger)}
.tbl td.zero-t{color:var(--danger);font-weight:800}
.bar.zero .bar-label{color:var(--muted);font-weight:600}
.bar.zero .bar-val b{color:var(--muted)}
.bar.zero .bar-val small{color:var(--danger);font-weight:700}
.bar.zero .bar-fill{min-width:0}
.tag{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:800;vertical-align:1px;white-space:nowrap}
.tag.venc{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.cal-block+.cal-block{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.cal-big{display:flex;align-items:baseline;gap:8px}
.cal-big b{font-size:32px;line-height:1;letter-spacing:-.02em}
.cal-big span{font-size:13px;font-weight:700;color:var(--muted)}
.f-chip.static{display:inline-flex;align-items:center;cursor:default;font-weight:600}
.ajustes{margin:0;padding-left:18px;font-size:13px;line-height:1.45;display:grid;gap:6px}
.heat-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding-bottom:4px}
.heat{width:100%;min-width:560px;border-collapse:separate;border-spacing:3px;font-size:12.5px}
.heat thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800;text-align:right;padding:0 6px 4px;white-space:nowrap}
.heat thead th:first-child,.heat tbody th,.heat tfoot th{text-align:left}
.heat tbody th,.heat tfoot th{position:sticky;left:0;z-index:1;background:var(--surface);padding:0 6px 0 0;white-space:nowrap}
.heat td{text-align:right;padding:7px 8px;border-radius:8px;font-weight:700;background:rgba(8,163,154,var(--a,0));white-space:nowrap}
.heat td.forte{color:#fff}
.heat td.z{background:var(--surface-2);color:var(--muted);font-weight:500}
.heat td.tot{background:var(--surface-3);font-weight:800}
.heat tfoot th{font-weight:800;font-size:13px}
.heat-u{border:0;background:transparent;padding:6px 0;min-height:32px;font-weight:800;font-size:13px;color:var(--ink);text-align:left}
.heat-u:hover{color:var(--teal-ink);text-decoration:underline}
@media print{.heat{min-width:0}.heat-wrap{overflow:visible}}

.donut-wrap{grid-template-columns:132px minmax(0,1fr)}
.dl,.dl-row span{min-width:0}
.dl-row{grid-template-columns:12px minmax(0,1fr) auto}
@media (max-width:480px){.donut-wrap{grid-template-columns:104px minmax(0,1fr);gap:12px}.donut{width:104px;height:104px}.donut-c b{font-size:19px}.dl-row b{font-size:16px}}
@media (min-width:900px){.donut-wrap{grid-template-columns:180px minmax(0,1fr)}}
.donut-c b.long{font-size:19px}
@media (min-width:900px){.donut-c b.long{font-size:25px}}
@media (max-width:480px){.donut-c b.long{font-size:14px}}

/* ---------- veículos à venda ---------- */
.hero-split .c{background:var(--blue)}
.hero-legend{flex-wrap:wrap}
.cor-dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none;vertical-align:-1px;margin-right:2px}
[data-theme="dark"] .cor-dot{border-color:rgba(255,255,255,.25)}
.dif{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap}
.dif.neg{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.dif.pos{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.dif.zero{background:var(--surface-3);color:var(--muted)}
.cal-big{display:flex;align-items:baseline;gap:8px}
.cal-big b{font-size:32px;line-height:1;letter-spacing:-.02em}
.cal-big span{font-size:13px;font-weight:700;color:var(--muted)}
.neg-t{color:var(--ok);font-weight:800}
.tbl td.neg-t{color:var(--ok)}

/* ajuste de preço */
.ajuste{display:block}
.ajuste-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.ajuste-top b{font-size:15px}
.ajuste-top span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ajuste-val b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.ajuste-val b.pos{color:var(--danger)}.ajuste-val b.neg{color:var(--ok)}
.range{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--ok),var(--surface-3) 50%,var(--danger));outline:none;margin:4px 0 12px}
.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--teal);box-shadow:var(--shadow);cursor:pointer}
.range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--teal);box-shadow:var(--shadow);cursor:pointer}
.ajuste-row{display:flex;gap:8px;align-items:center}
.ajuste-in{display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:44px;font-weight:700}
.ajuste-in span{color:var(--muted);font-weight:800}
.ajuste-in input{width:72px;border:0;background:transparent;font-size:16px;font-weight:800;outline:none;text-align:right}
.ajuste-row .btn{flex:1}
.ajuste-tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ajuste-tot>div{padding:10px 12px;border-radius:13px;background:var(--surface-2)}
.ajuste-tot span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.ajuste-tot b{font-size:18px}
.ajuste-tot b.neg{color:var(--ok)}.ajuste-tot b.pos{color:var(--danger)}

/* busca + sugestões */
.search-wrap{position:relative;flex:1}
.in-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.search input{text-transform:uppercase}
.sug{position:absolute;z-index:25;left:0;right:0;top:calc(100% + 6px);max-height:360px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:6px}
.sug[hidden]{display:none}
.sug-item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;width:100%;padding:10px 12px;border:0;border-radius:11px;background:transparent;text-align:left}
.sug-item:hover,.sug-item:focus-visible{background:var(--surface-2)}
.sug-item .placa{font-weight:800;font-size:15px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.sug-item .placa mark{background:color-mix(in srgb,var(--teal) 32%,transparent);color:inherit;border-radius:4px;padding:0 1px}
.sug-item>span:nth-child(2){grid-column:2;font-size:12.5px;color:var(--muted)}
.sug-item b{grid-row:1/3;font-size:14px;white-space:nowrap}
.sug-empty{padding:14px;font-size:13.5px;color:var(--muted)}

/* lista de veículos */
.veic-list{display:grid;gap:8px;grid-template-columns:1fr}
#v-area .veic{animation:rise .4s both;animation-delay:calc(var(--i,0) * 16ms)}
.veic{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .2s,transform .15s,box-shadow .2s}
.veic:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.veic:active{transform:scale(.99)}
.veic-head{grid-column:1;display:flex;align-items:center;gap:8px}
.veic-head .placa{font-weight:800;font-size:17px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.veic-cor{font-size:12px;color:var(--muted);font-weight:700}
.veic-mod{grid-column:1;font-size:13px;color:var(--muted);font-weight:600}
.veic-meta{grid-column:1;display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:2px}
.veic-preco{grid-column:2;grid-row:1/4;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.veic-preco b{font-size:18px;letter-spacing:-.01em}
@media (min-width:720px){.veic-list{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.veic-list{grid-template-columns:1fr 1fr 1fr}}

/* detalhe do veículo */
.placa-grande{font-size:30px;font-weight:800;letter-spacing:.1em;text-align:center;padding:12px;border-radius:14px;background:var(--navy-2);color:#fff;margin-bottom:12px;font-variant-numeric:tabular-nums}
.det{display:grid;gap:0;margin-top:4px}
.det-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.det-row:last-child{border-bottom:0}
.det-row span{color:var(--muted)}
.det-row b{font-weight:700;text-align:right}
.to{color:var(--danger)}
.ajustes{margin:0;padding-left:18px;font-size:13px;line-height:1.45;display:grid;gap:6px}
.heat-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding-bottom:4px}
.tbl th{white-space:nowrap}
.tbl td{white-space:nowrap}
</style>
</head>

<script>(() => {
'use strict';
/* ===================== utilidades ===================== */
const CFG = JSON.parse(document.getElementById('cfg').textContent);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduz = matchMedia('(prefers-reduced-motion: reduce)');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(Number(n) || 0).toLocaleString('pt-BR');
const pct = (a, b, d = 1) => (b ? (a / b * 100).toFixed(d).replace('.', ',') + '%' : '–');
const dec1 = n => Number(n).toFixed(1).replace('.', ',');
const moeda = n => 'R$ ' + Math.round(Number(n) || 0).toLocaleString('pt-BR');
const moedaK = n => 'R$ ' + (Number(n) / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil';
const km = n => fmt(n) + ' km';
const ic = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const sem = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const busca = s => sem(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
const plural = (n, um, varios) => `${fmt(n)} ${Math.round(n) === 1 ? um : varios}`;
const nVe = n => plural(n, 'veículo', 'veículos');

/* ===================== dados ===================== */
const REG = CFG.registros.map((r, i) => ({ ...r, i }));
const COR_HEX = CFG.coresHex || {};
const MODELOS = [...new Set(REG.map(r => r.modelo))];
const COR_PALETA = ['#1f4f78', '#2078a8', '#08a39a', '#f5a20b', '#c2410c', '#7fb3d5'];
const corModelo = m => COR_PALETA[MODELOS.indexOf(m) % COR_PALETA.length];
const faixaKm = v => v < 30000 ? 'Até 30 mil' : v < 60000 ? '30 a 60 mil' : v < 90000 ? '60 a 90 mil' : 'Acima de 90 mil';
const FAIXAS_KM = ['Até 30 mil', '30 a 60 mil', '60 a 90 mil', 'Acima de 90 mil'];
const faixaDias = d => d <= 20 ? 'Até 20 dias' : d <= 40 ? '21 a 40 dias' : d <= 60 ? '41 a 60 dias' : 'Mais de 60 dias';
const FAIXAS_DIAS = ['Até 20 dias', '21 a 40 dias', '41 a 60 dias', 'Mais de 60 dias'];

/* preço final = anúncio ajustado pelo delta do usuário (em pontos percentuais sobre o anúncio).
   ajuste 0 = preço de anúncio original. */
let AJUSTE = 0;
const precoFinal = r => Math.round(r.anuncio * (1 + AJUSTE / 100));
const difFipe = r => (precoFinal(r) - r.fipe) / r.fipe * 100;

/* ===================== filtros ===================== */
const MULTI = ['modelo', 'cor', 'faixaKm', 'faixaDias'];
const F_LABEL = { modelo: 'Modelo', cor: 'Cor', faixaKm: 'Quilometragem', faixaDias: 'Tempo de estoque' };
const S = { f: {}, tab: 'geral', vq: '', vs: 'dias', avisoFechado: false };
MULTI.forEach(k => { S.f[k] = new Set(); });
const valor = (r, k) => ({ modelo: r.modelo, cor: r.cor, faixaKm: faixaKm(r.km), faixaDias: faixaDias(r.dias) }[k]);
function passa(r, ignora) {
  for (const k of MULTI) {
    if (k === ignora || !S.f[k].size) continue;
    if (!S.f[k].has(String(valor(r, k)))) return false;
  }
  if (S.vq) { const q = busca(S.vq); if (q && !busca(r.placa).includes(q)) return false; }
  return true;
}
const filtrados = () => REG.filter(r => passa(r));
const nAtivos = () => (S.vq ? 1 : 0) + MULTI.reduce((a, k) => a + S.f[k].size, 0);
const rotF = (k, v) => v;

/* ===================== agregação e peças ===================== */
function agg(rs, fn) {
  const m = new Map();
  for (const r of rs) {
    const k = fn(r); if (k == null || k === '') continue;
    const o = m.get(k) || { k: String(k), n: 0, anuncio: 0, fipe: 0, final: 0, km: 0 };
    o.n++; o.anuncio += r.anuncio; o.fipe += r.fipe; o.final += precoFinal(r); o.km += r.km;
    m.set(k, o);
  }
  return [...m.values()];
}

    if (!(history.state && history.state.painel)) { try { history.pushState({ painel: 1 }, ''); } catch (e) { /* sem histórico */ } }
  }

}
function valoresFiltro(k) {
  if (k === 'faixaKm') return FAIXAS_KM.filter(f => REG.some(r => faixaKm(r.km) === f));
  if (k === 'faixaDias') return FAIXAS_DIAS.filter(f => REG.some(r => faixaDias(r.dias) === f));
  const m = new Map();
  for (const r of REG) { const v = valor(r, k); m.set(v, (m.get(v) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]).map(a => a[0]);
}
const faceta = (k, v) => REG.filter(r => passa(r, k) && String(valor(r, k)) === v).length;
function corpoFiltros() {
  const grupo = k => `<div class="f-group"><b>${F_LABEL[k]}</b><div class="f-chips">` + valoresFiltro(k).map(v => {
    const on = S.f[k].has(v), n = faceta(k, v);
    return `<button type="button" class="f-chip" data-act="${k}" data-v="${esc(v)}" aria-pressed="${on}"${n || on ? '' : ' data-zero'}>${k === 'cor' ? selo(v) : ''}${esc(rotF(k, v))}<small>${fmt(n)}</small></button>`;
  }).join('') + `</div></div>`;
  return MULTI.map(grupo).join('') + `<p class="card-note" style="margin:0">A busca por placa fica na aba Veículos.</p>`;
}
const rodapeFiltros = () => `<button type="button" class="btn" data-act="limpar">${ic('x')} Limpar</button>` +
  `<button type="button" class="btn primary" data-act="fechar-painel">Ver ${nVe(filtrados().length)}</button>`;
const subFiltros = () => `${nAtivos() || 'Nenhum'} filtro${nAtivos() === 1 ? '' : 's'} ativo${nAtivos() === 1 ? '' : 's'}`;
const painelFiltros = () => abrirPainel('filtros', 'Filtros', subFiltros(), corpoFiltros(), rodapeFiltros());
function atualizarPainelFiltros() {
  const b = $('#sheet-body'), y = b.scrollTop;
  b.innerHTML = corpoFiltros(); b.scrollTop = y; $('#sheet-foot').innerHTML = rodapeFiltros();
  $('#sheet-sub').textContent = subFiltros();
}
function painelFontes() {
  abrirPainel('fontes', 'Fontes dos dados', 'De onde vêm os números desta tela',
    `<div class="src"><div class="src-top"><b>Estoque de veículos</b><span class="pill off">Dados fixos</span></div><dl>` +
    `<dt>Relatório</dt><dd>${esc(CFG.fonte)}</dd><dt>Loja</dt><dd>${esc(CFG.loja)}</dd><dt>Local</dt><dd>${esc(CFG.local)}</dd>` +
    `<dt>Dados de</dt><dd>${esc(CFG.data)} (gravados neste arquivo)</dd><dt>Veículos</dt><dd>${fmt(REG.length)}</dd></dl></div>` +
    `<h3 style="margin:14px 0 8px;font-size:14px">Como os valores funcionam</h3><ul class="ajustes">` +
    `<li>A <b>FIPE</b> é o valor de tabela por modelo e não muda com o ajuste.</li>` +
    `<li>O <b>anúncio</b> é o preço do relatório (atacado). O <b>valor final</b> é o anúncio com o ajuste percentual aplicado.</li>` +
    `<li>A diferença <b>x FIPE</b> compara o valor final com a FIPE. Verde = abaixo da FIPE.</li>` +
    `<li>O ajuste vale para toda a dashboard enquanto estiver aberta; “Restaurar” volta ao preço de anúncio.</li></ul>` +
    `<p class="card-note" style="margin:10px 0 0">Esta dashboard não acessa a internet. Para atualizar, gere o arquivo de novo com o relatório novo.</p>`,
    `<button type="button" class="btn primary" data-act="fechar-painel">Fechar</button>`);
}

/* ===================== render ===================== */
const VIEWS = { geral: vGeral, modelos: vModelos, veiculos: vVeiculos, comparar: vComparar };
const KPIS = [['total', 'Veículos', 't-n'], ['modelos', 'Modelos', 't-n'], ['final', 'Valor final (soma)', 't-l'],
  ['medio', 'Valor final médio', 't-l'], ['dif', 'Média x FIPE', 't-p'], ['km', 'Km médio', 't-n']];
function renderHero() {
  const mods = agg(REG, r => r.modelo).sort(porN), t = REG.length;
  contar($('#h-total'), t);
  const cores = [corModelo(mods[0] && mods[0].k), corModelo(mods[1] && mods[1].k), corModelo(mods[2] && mods[2].k)];
  ['h-l', 'h-p', 'h-c'].forEach((id, i) => { const el = $('#' + id); if (el) { el.style.background = cores[i] || 'transparent'; el.style.width = (mods[i] ? mods[i].n / t * 100 : 0) + '%'; } });
  $('#h-legend').innerHTML = mods.map(m => `<span style="color:${corModelo(m.k)}">${esc(m.k)} · ${fmt(m.n)}</span>`).join('');
  const fin = REG.reduce((a, r) => a + precoFinal(r), 0);
  $('#h-ratio').innerHTML = `<b>${moedaK(fin)}</b>soma do valor final${AJUSTE ? ` · ajuste ${AJUSTE > 0 ? '+' : ''}${dec1(AJUSTE)}%` : ''}`;
}
function renderKpis(rec) {
  const n = rec.length, fin = rec.reduce((a, r) => a + precoFinal(r), 0), fipe = rec.reduce((a, r) => a + r.fipe, 0);
  const kmMed = n ? Math.round(rec.reduce((a, r) => a + r.km, 0) / n) : 0;
  const set = (k, v, sub, f = fmt) => { contar($(`[data-k="${k}"]`), v, f); $(`[data-s="${k}"]`).textContent = sub; };
  set('total', n, nAtivos() ? 'com os filtros' : 'disponíveis');
  set('modelos', new Set(rec.map(r => r.modelo)).size, 'no estoque filtrado');
  set('final', fin, `${nAtivos() ? 'filtrado' : 'estoque todo'}`, moedaK);
  set('medio', n ? Math.round(fin / n) : 0, 'por veículo', moedaK);
  set('dif', fipe ? (fin - fipe) / fipe * 100 : NaN, 'valor final x FIPE', v => (v > 0 ? '+' : '') + dec1(v) + '%');
  set('km', kmMed, 'quilometragem', km);
}
const chipX = (k, v) => `<button type="button" class="chip-x" data-act="rm" data-k="${k}" data-v="${esc(v)}" aria-label="Remover filtro ${esc(v)}">${esc(v)}${ic('x')}</button>`;
function renderChips() {
  const out = [];
  if (S.vq) out.push(`<button type="button" class="chip-x" data-act="placa-clear">Placa: ${esc(S.vq)}${ic('x')}</button>`);
  MULTI.forEach(k => S.f[k].forEach(v => out.push(chipX(k, v))));
  $('#chips').innerHTML = out.length ? out.join('') + `<button type="button" class="chip-x limpar" data-act="limpar">Limpar tudo</button>`
    : `<span class="chips-hint">Sem filtros ativos</span>`;
  $('#f-count').textContent = nAtivos() || '';
  $('#print-filters').textContent = out.length ? 'Filtros: ' + [S.vq ? `Placa: ${S.vq}` : null, ...MULTI.flatMap(k => [...S.f[k]].map(v => `${F_LABEL[k]}: ${v}`))].filter(Boolean).join(' · ') : 'Sem filtros';
}
function renderView(trocouAba) {
  ci = 0;
  const rec = filtrados(), v = $('#view');
  v.innerHTML = VIEWS[S.tab](rec);
  if (trocouAba) { v.classList.remove('anim'); void v.offsetWidth; v.classList.add('anim'); clearTimeout(v._t); v._t = setTimeout(() => v.classList.remove('anim'), 900); }
  if (S.tab === 'veiculos') listaVeiculos();
  animar(v);
  renderKpis(rec);
}
function render(trocouAba) { renderHero(); renderChips(); renderView(trocouAba); if (painel === 'filtros') atualizarPainelFiltros(); }
function trocarAba(t, rolar = true) {
  if (!VIEWS[t]) t = 'geral';
  const mudou = S.tab !== t; S.tab = t;
  $$('.tab').forEach(b => { const on = b.dataset.v === t; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
  try { history.replaceState(history.state, '', '#' + t); } catch (e) { /* sem histórico */ }
  renderView(mudou);
  if (rolar) {
    const alvo = $('#kpis').getBoundingClientRect().top + window.scrollY - (innerWidth >= 900 ? 130 : 70);
    if (window.scrollY > alvo) window.scrollTo({ top: Math.max(0, alvo), behavior: reduz.matches ? 'auto' : 'smooth' });
  }
}
function renderStatus() {
  $('#status').dataset.s = 'fixo';
  $('#status-txt').textContent = `Dados fixos · ${CFG.data}`;
  const av = $('#notice');
  av.dataset.s = 'fixo';
  av.innerHTML = `${ic('info')}<div><p>Você está vendo o estoque de <b>${esc(CFG.data)}</b> (${esc(CFG.loja)}), gravado neste arquivo. A dashboard não acessa a internet.</p>` +
    `<div class="acts"><button type="button" class="btn ghost" data-act="fontes">${ic('database')} Detalhes</button></div></div>` +
    `<button type="button" class="notice-close" data-act="fechar-aviso" aria-label="Fechar aviso">${ic('x')}</button>`;
  av.hidden = S.avisoFechado;
}
function renderFooter() {
  $('#footer').innerHTML = `<b>Fonte:</b> relatório “${esc(CFG.fonte)}” · ${esc(CFG.loja)} · ${esc(CFG.local)}. Dados fixos de ${esc(CFG.data)}. ` +
    `<button type="button" class="link-btn" data-act="fontes" style="display:inline;min-height:0;padding:0">Ver detalhes</button><br>` +
    `FIPE é o valor de tabela. O valor final aplica o ajuste percentual sobre o anúncio. Documento de uso interno · não acessa a internet.`;
}

/* ===================== exportação ===================== */
function baixarCSV(nome, linhas) {
  const cel = c => { let s = String(c ?? ''); if (/^[=+\-@]/.test(s) && !/^-?\d/.test(s)) s = "'" + s; return /[;"\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = '\uFEFF' + linhas.map(l => l.map(cel).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const hoje = () => new Date().toISOString().slice(0, 10);
function csvVeiculos() {
  baixarCSV(`veiculos-pv-${hoje()}.csv`, [['Placa', 'Modelo', 'Versão', 'Ano', 'Cor', 'Km', 'Dias em estoque', 'FIPE', 'Anúncio', `Valor final (${AJUSTE > 0 ? '+' : ''}${dec1(AJUSTE)}%)`, 'x FIPE %'],
    ...veicVisiveis().map(r => [r.placa, r.modelo, r.versao, r.ano, r.cor, r.km, r.dias, r.fipe, r.anuncio, precoFinal(r), dec1(difFipe(r))])]);
}

/* ===================== eventos ===================== */
function alternar(k, v) { const s = S.f[k]; if (s.has(v)) s.delete(v); else s.add(v); }
function limpar() { S.vq = ''; MULTI.forEach(k => S.f[k].clear()); }
function aplicarAjuste(v) {
  v = Math.max(-90, Math.min(200, Number(v) || 0));
  AJUSTE = Math.round(v * 10) / 10;
  render();
}
function tema(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('veic-tema', t); } catch (e) { /* indisponível */ }
  const b = $('#btn-theme'); b.innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
  b.setAttribute('aria-label', t === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'); b.title = b.getAttribute('aria-label');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (MULTI.includes(a)) { alternar(a, v); render(); return; }
  switch (a) {
    case 'tab': trocarAba(v); break;
    case 'rm': S.f[b.dataset.k].delete(v); render(); break;
    case 'limpar': limpar(); render(); break;
    case 'veic-det': painelVeic(v); break;
    case 'sug': { const inp = $('#v-busca'); S.vq = v; if (inp) inp.value = v; const box = $('#v-sug'); if (box) box.hidden = true; render(); break; }
    case 'placa-clear': S.vq = ''; render(); break;
    case 'ver-modelo': S.f.modelo = new Set([v]); trocarAba('veiculos'); render(); break;
    case 'filtrar-modelo': S.f.modelo = new Set([v]); fecharPainel(); render(); break;
    case 'ajuste-reset': aplicarAjuste(0); break;
    case 'csv-veiculos': csvVeiculos(); break;
    case 'fontes': painelFontes(); break;
    case 'filtros': painelFiltros(); break;
    case 'fechar-painel': fecharPainel(); break;
    case 'fechar-aviso': S.avisoFechado = true; $('#notice').hidden = true; break;
    case 'tema': tema(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); break;
    case 'imprimir': window.print(); break;
    default: break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'v-busca') { S.vq = e.target.value; renderChips(); renderKpis(filtrados()); listaVeiculos(); sugestoes(); }
  else if (e.target.id === 'ajuste-range') { AJUSTE = Math.round(Number(e.target.value) * 10) / 10; const num = $('#ajuste-num'); if (num) num.value = dec1(AJUSTE); aplicarAjusteLeve(); }
  else if (e.target.id === 'ajuste-num') { /* aplica ao confirmar (change/Enter) */ }
});
/* o range atualiza tudo, mas sem recriar o próprio input, para não perder o arraste */
let ajTimer = null;
function aplicarAjusteLeve() {
  renderHero(); renderKpis(filtrados());
  const sinal = AJUSTE > 0 ? '+' : '';
  $$('.ajuste-val b').forEach(el => { el.textContent = sinal + dec1(AJUSTE) + '%'; el.className = AJUSTE < 0 ? 'neg' : AJUSTE > 0 ? 'pos' : ''; });
  clearTimeout(ajTimer); ajTimer = setTimeout(() => render(), 220);
}
document.addEventListener('change', e => {
  if (e.target.id === 'v-ordem') { S.vs = e.target.value; listaVeiculos(); }
  else if (e.target.id === 'ajuste-num') aplicarAjuste(e.target.value);
  else if (e.target.id === 'ajuste-range') aplicarAjuste(e.target.value);
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'v-busca' && e.key === 'Enter') {
    const prim = filtrados().filter(r => busca(r.placa).includes(busca(S.vq))).sort((a, b) => a.placa.localeCompare(b.placa))[0];
    if (prim) { e.preventDefault(); painelVeic(prim.placa); }
    return;
  }
  if (!painel) return;
  if (e.key === 'Escape') { e.preventDefault(); fecharPainel(); return; }
  if (e.key !== 'Tab') return;
  const foc = $$('#sheet button, #sheet a[href], #sheet input, #sheet select').filter(x => !x.disabled && x.offsetParent !== null);
  if (!foc.length) return;
  const [p, u] = [foc[0], foc[foc.length - 1]];
  if (e.shiftKey && document.activeElement === p) { e.preventDefault(); u.focus(); }
  else if (!e.shiftKey && document.activeElement === u) { e.preventDefault(); p.focus(); }
});
$('#scrim').addEventListener('click', () => fecharPainel());
$('#sheet-close').addEventListener('click', () => fecharPainel());
$('.tabs').addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const tabs = $$('.tab'), i = tabs.findIndex(t => t.getAttribute('aria-selected') === 'true');
  const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
  trocarAba(n.dataset.v); n.focus();
});
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap') && $('#v-sug')) $('#v-sug').hidden = true; });
window.addEventListener('popstate', () => { if (painel) fecharPainel(true); });

/* ===================== início ===================== */
$('#sub-loja').textContent = `${CFG.loja} · ${CFG.local}`;
$('#kpis').innerHTML = KPIS.map(([k, l, c], i) => `<div class="kpi ${c}" style="--i:${i}"><span class="kpi-label">${l}</span><span class="kpi-val" data-k="${k}">0</span><span class="kpi-sub" data-s="${k}"></span></div>`).join('');
tema(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
const abaInicial = (location.hash || '').slice(1);
S.tab = VIEWS[abaInicial] ? abaInicial : 'geral';
$$('.tab').forEach(b => { const on = b.dataset.v === S.tab; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
renderHero(); renderStatus(); renderFooter(); renderChips(); renderView(true);
window.__DASH__ = { REG, S, CFG, filtrados, precoFinal, get AJUSTE() { return AJUSTE; }, setAjuste: aplicarAjuste };
})();
</script>
</body>
</html>
